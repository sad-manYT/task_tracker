[project]
name = "task-tracker"
version = "0.1.0"
description = "Backend-приложение «Список задач» (REST API)"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
# E/W — стиль, F — ошибки, I — сортировка импортов, B — типичные баги, S — правила безопасности
select = ["E", "W", "F", "I", "B", "S", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.coverage.run]
source = ["app"]
